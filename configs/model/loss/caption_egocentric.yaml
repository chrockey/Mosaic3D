# @package model
# The released caption loss, with the two adjustments single-view training needs.
# The objective itself is unchanged -- switching to CaptionCLIPLoss/SigLIP would
# change what is optimised, which is not something to do while post-training a
# converged encoder.
loss_cfg:
  caption_loss:
    reduction: weighted_sum
    use_logit_scale: true
    # The temperature is LEARNED, as in the released recipe.  It was frozen at the released
    # 5.08385 (exp 161.4, tau 0.0062) for the ARKitScenes plan; on EgoDex that froze the run
    # into divergence twice (2026-09-01, lr 0.025 and lr 0.01, both at step ~330-450, both
    # after the loss had reached ~4.8): human-demo captions are full of near-duplicate
    # sentences for the same object across clips, exact-string dedup cannot merge them, and at
    # tau 0.0062 those false negatives hand the model huge contradictory gradients once the
    # easy separation is learned -- the loss climbs ABOVE the ln(6,100) chance level.  A free
    # temperature can soften.  Starts from the released value (init_weights_from loads it).
    freeze_logit_scale: false
    # ...but capped at CLIP's ln(100) = 4.60517 (scale 100). Runs 4 and 5 (2026-09-01) showed the free
    # scale climbing from the released 161 to 2,400-3,200 by step 1,350 and the loss turning up once it
    # passed ~600-800, at the same step for lr 0.01 and 0.004 -- the runaway temperature, not the lr,
    # was the divergence. The cap is below the released 161, so the scale will sit at 100.
    max_logit_scale: 4.60517
    # Share caption embeddings across ranks so the softmax denominator is the
    # global batch.  At 64 frames/GPU x 4 GPUs x ~5.3 masks this restores the
    # ~1200-caption negative pool the released recipe had at 4 scenes/GPU.
    gather_text: true
  seg_loss:
    normalize_input: false
    text_clip_path: !!null
    loss_type: cross_entropy
    ignore_label: ${data.train_dataset.ignore_label}
    learnable_logit: false
    eval_only: true
  binary_loss: false
  weights:
    binary_loss: 0.0
    caption_loss: 1.0
    seg_loss: 0.0
  sync_dist: false
