# @package _global_
#
# Post-training the released spunet101 encoder on EGODEX human demonstrations.
#
#   python src/train.py experiment=posttrain_spunet101_egodex \
#       init_weights_from=/path/to/spunet101.ckpt
#
# This is the second post-training corpus.  The first (posttrain_spunet101_egocentric,
# ARKitScenes frames) isolated exactly one variable -- full reconstruction -> single view -- on
# scenes spunet101 had already seen.  This one changes the DOMAIN as well: head-mounted views of
# human hands manipulating tabletop objects, which is what the DexJoCo tasks look like and what
# room-scan pretraining has never contained.  ARKitScenes is deliberately NOT mixed in here (user
# directive 2026-08-31: egodex and vitra only); vitra has no 3D-text pairs yet.
#
# WHAT IT TRAINS ON, exactly: src/data/metadata/split_files/egodex_train.txt, 320,876 episodes
# over six parts, each listed because both files egodex_io.py opens are present.  egodex_test's
# 3,104 episodes are in egodex_val.txt and appear in neither.  The same set is recorded with a
# sha256 by PointWAM tools/build_human_demo_manifest.py.
#
# THE STEP BUDGET.  4 ranks x 224 = 896 samples/step.  A sample is (episode, a clip drawn at random),
# so an epoch (320,876 samples) sees one clip per episode.  The budget is held at the SAME sample
# exposure the 1-GPU plan had -- 3.84M samples = 11.97 epochs = ~12 clips/episode (median clips/episode
# is 10, mean 15.18), 3.8x the ARKitScenes plan's 1.02M -- which at 896/step is 4,300 steps.
# (train-budget-by-sample-exposure: a batch change rescales steps, it does not change the budget.)
#
# THE LEARNING RATE.  caption_loss reduction=weighted_sum is (loss*n_pts).sum()/n_pts.sum(): a weighted
# MEAN over captions, so the gradient does not grow with the batch and the linear scaling rule applies
# (SGD, Goyal et al.).  The 1-GPU anchor was lr 5e-3 at ~1,193 unique captions/step.  The linear rule
# gave 0.025 for ~6,100 -- and DIVERGED: run dger9lqn/qznr (2026-09-01) trained cleanly while the
# warmup passed 0.009-0.020 (loss 8.63 -> 4.76 by step 315), then after the 0.025 peak the loss went
# 5.25 (step 523) -> 9.79 (step ~680, above the ln(6,100)=8.7 chance level) while egodex_test
# retrieval fell from recall@1 0.02768 (step 450) to 0.01014 (step 600).  So the peak is set by the
# square-root rule instead, 5e-3 x sqrt(4.5) = 0.0106 -> 0.01, inside the range that trained.
# OneCycle over 4,300 steps, pct_start 0.1 = 430 warmup.
#
# OneCycle anneals to zero at max_steps, so max_steps is fixed at launch and cannot be extended
# afterwards without changing the schedule the run was trained under.
#
# ONE-GPU VARIANT (the earlier plan, still valid): trainer.devices=1 data.batch_size=192
# model.optimizer.lr=5e-3 trainer.max_steps=20000 callbacks.model_checkpoint.every_n_train_steps=1000.
#
# What changes from the released recipe (SGD 0.05 nesterov, wd 1e-4, OneCycle pct_start 0.05
# div 10 final_div 1e4, 4 scenes/GPU x 8 A100, 57,600 steps, 16-mixed, no clip, no EMA):
#   lr 0.05 -> 0.01        one tenth at the released ~1,200-caption pool, then x sqrt(5.11) for the
#                          4-rank 1,024-clip pool; the linear rule's 0.025 diverged (see above).
#   pct_start 0.05 -> 0.1  longer warmup, same reason.
#   final_div 1e4 -> 1e3   same 5e-6 floor from a 10x lower peak.
#   57,600 -> 4,300        post-training, not retraining; 3.84M samples, see the budget note above.
#   grad clip none -> 1.0  cheap insurance while the distribution shifts.
#   batch 4 -> 224 x 4     the loss's denominator is the GLOBAL batch's unique captions; see data/egodex.
#   logit_scale frozen, caption negatives gathered across ranks -- model/loss/caption_egocentric.
#   validation             REMOVED from the loop; a snapshot every 150 steps instead (28 candidates).
#
# HOW A SNAPSHOT IS CHOSEN.  Two cheap signals in different domains, so neither leaks into the
# other, and closed-loop SR is spent only on the one they pick:
#   (a) the DexJoCo hammer_nail per-point probe -- the defect being fixed, R2 from 0.0688
#   (b) caption retrieval on egodex_test -- the language alignment being protected
# Take the snapshot maximising (a) subject to (b) not falling.
#
# trainer.precision=bf16-true CRASHES: spconv-cu124 2.3.8 has no bf16 entry in _TORCH_DTYPE_TO_TV
# (spconv/pytorch/cppcore.py:79).  16-mixed is the proven setting.

defaults:
  - override /data: egodex
  - override /model: spunet101+ppt
  - override /model/clip: recap_clip
  - override /model/loss: caption_egocentric
  - override /optim: sgd
  - override /scheduler: onecyclelr
  - override /callbacks: cluster_nolr
  - override /trainer: ddp

seed: 12345

trainer:
  max_steps: 4300
  max_epochs: -1
  limit_val_batches: 0
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0
  # BatchNorm statistics are the first thing a distribution shift breaks, and this shift is the
  # largest of the three tried: the released stats come from ~150k-point reconstructions, an
  # EgoDex clip is 6,622 points.  At 224 x 4 each step sees 5.9M points.
  # Four ranks here, so it re-estimates them from the 896-clip global batch.
  sync_batchnorm: True

model:
  optimizer:
    lr: 0.01
  scheduler:
    pct_start: 0.1
    final_div_factor: 1000.0
  best_metric: ${data.checkpoint_monitor}

test: False

callbacks:
  # Nothing is monitored in-loop, so save unconditionally and keep every snapshot: with no
  # validation curve the only way to choose is to evaluate them afterwards.  Every 150 steps over
  # 4,300 gives 28 candidates, which is the resolution the two signals above can afford.
  model_checkpoint:
    monitor: null
    save_top_k: -1
    every_n_train_steps: 150
    save_last: True
    filename: "step_{step:06d}"

logger:
  wandb:
    tags: ${tags}
    group: "mosaic3d-egodex"
