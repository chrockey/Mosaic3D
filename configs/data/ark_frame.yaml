# ARKitScenes as SINGLE-VIEW frames, for post-training the released encoder on
# egocentric clouds.  Diffs from configs/data/sc.yaml, all deliberate:
#
#   * dataset      ARKitScenesFrameDataset -- one sample = one annotated frame
#                  (the scene points that camera saw), not a whole reconstruction.
#   * CenterShift(apply_z=true)  DROPPED.  The dataset already shifts by the FULL
#                  scene's xy bbox centre and z-min.  Applied per frame it would
#                  put the lowest *visible* point at z=0, and a view of a tabletop
#                  has no floor in it, so "height above the floor" would mean
#                  something different in every sample.
#   * SphereCrop   DROPPED.  point_max=250000 never triggers at frame scale
#                  (mean 28k points), and cutting a sphere out of a frustum makes
#                  a shape that occurs in neither pretraining nor deployment.
#   * num_masks    unset.  A frame carries ~5 masks; there is nothing to subsample.
#   * batch_size   64/GPU.  Frames are ~5.4x smaller than scenes, and the softmax
#                  denominator is the batch's unique captions -- at the released
#                  batch of 4 it would fall from ~1200 captions to ~21.  64/GPU
#                  x 4 GPUs with loss gather_text restores the pretraining pool.
#
# Everything else (rotation, scale, flip, jitter, elastic, chromatic, colour
# normalisation, 2 cm grid) is byte-identical to the released recipe.

_target_: src.data.datamodule.MultiDataModule

train_dataset:
  _target_: src.data.multi_dataloader.ConcatDataset
  _partial_: true
  ignore_label: -100
  # Three, not one. This list sizes net.embedding_table (PPT's condition embedding),
  # and the released spunet101.ckpt carries 3 rows; one row is a load_state_dict
  # shape mismatch before step 0. ConcatDataset swallows the kwarg unused, and the
  # per-sample tag stays ARKitScenes (the Add transform below).
  conditions: ["ScanNet", "ARKitScenes", "ScanNetPP"]
  repeat: 1
  datasets:
    - _target_: src.data.egocentric.arkit_frame_dataset.ARKitScenesFrameDataset
      _partial_: true
      data_dir: /datasets/mosaic3d/data/arkitscenes
      raw_dir: /datasets/mosaic3d/arkit_raw
      split: train
      ignore_label: -100
      repeat: 1
      num_masks: null
      align_source: gsam2
      # gsam2 ONLY. frames.<src>.npz is written from the gsam2 grouping and there is
      # no frames.seem.npz; group counts differ between the two sources in 17.0% of
      # scenes, so a seem draw would index a different frame. Measured effect of
      # leaving both in: ~8.5% of samples get a shifted index, coverage 0.6143.
      anno_sources: ["gsam2"]
      min_score: 0.5
      min_mask_points: 32
      min_frame_points: 2000
      max_frame_points: 200000
      pose_jitter: 5          # +-0.5 s on a 10 Hz track: a real, mild view change
      fov_jitter: 0.15        # the encoder must not be tied to the iPad's f=213
      z_far: 8.0
      z_far_jitter: [3.0, 8.0]  # consumer and robot depth cameras are range limited
      transforms:
        - type: FilterCaption
          min_words: 1
          max_words: 50
          min_letter_ratio: 0.5
          max_repetition_ratio: 0.4
          max_consecutive: 3
        - type: Copy
          keys_dict:
            coord: origin_coord
        - type: RandomRotate
          p: 0.5
          angle: [-1, 1]
          center: [0, 0, 0]
          axis: "z"
        - type: RandomRotate
          p: 0.5
          angle: [-0.015625, 0.015625]
          axis: "x"
        - type: RandomRotate
          p: 0.5
          angle: [-0.015625, 0.015625]
          axis: "y"
        - type: RandomScale
          scale: [0.9, 1.1]
        - type: RandomFlip
          p: 0.5
        - type: RandomJitter
          sigma: 0.005
          clip: 0.02
        - type: ElasticDistortion
        - type: ChromaticAutoContrast
          p: 0.2
        - type: ChromaticTranslation
          p: 0.95
          ratio: 0.05
        - type: ChromaticJitter
          p: 0.95
          std: 0.05
        - type: CenterShift
          apply_z: false
        - type: NormalizeColor
        - type: Add
          keys_dict:
            condition: ARKitScenes
        - type: ToTensor
        - type: Collect
          keys:
            [
              "origin_coord",
              "coord",
              "color",
              "segment",
              "instance",
              "binary",
              "caption_data",
              "origin_idx",
              "condition",
            ]
          offset_keys_dict:
            offset: coord
            pc_count: origin_coord
          feat_keys: ["color"]

# NO validation (user directive 2026-08-19, reaffirmed 2026-08-20). Empty, not just
# limit_val_batches=0: DataModule.setup builds val_datasets unconditionally
# (src/data/datamodule.py:37-38), regardless of stage or limit_val_batches, and
# BaseDataset asserts its data_dir exists. Leaving a ScanNet val entry here would
# make the training pod depend on /datasets/mosaic3d/data/scannet for a dataloader
# that is never iterated.
#
# Checkpoint selection is by step instead: a snapshot every 500 steps, all kept.
# To evaluate one afterwards (this is the command that produced the 0.16007
# ScanNet200 mIoU start point):
#   python3.10 src/eval.py experiment=train_spunet_multidata_ppt data=sc \
#     model=spunet101+ppt ckpt_path=<ckpt> +trainer.precision=16-mixed \
#     "data.train_dataset.conditions=[ScanNet,ARKitScenes,ScanNetPP]"
val_datasets: []

collate_fn:
  _target_: src.data.utils.collate.point_collate_fn_with_masks
  _partial_: true
  grid_size: 0.02

batch_size: 64
num_workers: 12
in_channel: 3

checkpoint_monitor: "val_scannet200/miou"
